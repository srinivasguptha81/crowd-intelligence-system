services:
  - type: web
    name: crowdguard-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: standard
    envVars:
      - key: APP_NAME
        value: CrowdGuard AI
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: ENABLE_YOLO
        value: "true"
      - key: RTSP_ENABLED
        value: "true"
      - key: AUTH_ENABLED
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "150"
      - key: ANALYSIS_MAX_FRAMES
        value: "120"

